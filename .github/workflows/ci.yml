name: Vertical slice checks
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iron
          POSTGRES_PASSWORD: iron
          POSTGRES_DB: iron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iron"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://iron:iron@localhost:5432/iron_test
      TEST_DATABASE_URL: postgresql+psycopg://iron:iron@localhost:5432/iron_test
      REDIS_URL: redis://localhost:6379/0
      BOT_TOKEN: 123456:test-only-not-a-real-token
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: alembic upgrade head && python -m app.seed && alembic check
        working-directory: server
      - run: python -m pytest -q
        working-directory: server
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: client/package-lock.json}
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: client
      - name: Browser vertical cycle with real timers
        env:
          TEST_APP_URL: http://127.0.0.1:8000
        run: |
          cd server
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          cd ../client
          node tests/cycle.mjs

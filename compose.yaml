services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: iron
      POSTGRES_PASSWORD: iron
      POSTGRES_DB: iron
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iron"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://iron:iron@postgres:5432/iron
      REDIS_URL: redis://redis:6379/0
    command: sh -c 'alembic upgrade head && python -m app.seed'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://iron:iron@postgres:5432/iron
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://iron:iron@postgres:5432/iron
      REDIS_URL: redis://redis:6379/0
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
  bot:
    profiles: ["bot"]
    build: .
    env_file: .env
    command: python -m app.bot
    depends_on: [api]
volumes:
  pgdata:
